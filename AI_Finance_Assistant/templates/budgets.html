{% extends 'base.html' %}{% block content %}<div class="card"><h2>Create Budget</h2><form method="post"><div class="form-group"><label>Month</label><input type="month" name="month" required></div><div class="form-group"><label>Category</label><input name="category" value="Overall" placeholder="Overall or Food"></div><div class="form-group"><label>Limit Amount</label><input type="number" step="0.01" min="0.01" name="limit_amount" required></div><button class="btn">Create Budget</button></form></div><div class="card"><h2>Your Budgets</h2><table><tr><th>Month</th><th>Category</th><th>Limit</th></tr>{% for b in budgets %}<tr><td>{{b.month}}</td><td>{{b.category}}</td><td>₹{{'%.2f'|format(b.limit_amount)}}</td></tr>{% endfor %}</table></div>{% endblock %}
