<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Finance Assistant</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav class="nav"><b>AI Finance Assistant</b><div>{% if session.get('user_id') %}<a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('add_transaction') }}">Add Transaction</a><a href="{{ url_for('budgets') }}">Budgets</a><a href="{{ url_for('chatbot') }}">Chatbot</a><a href="{{ url_for('logout') }}">Logout</a>{% else %}<a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('register') }}">Register</a>{% endif %}</div></nav><main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="alert {{category}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
