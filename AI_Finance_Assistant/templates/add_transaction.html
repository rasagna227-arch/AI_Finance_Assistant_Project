{% extends 'base.html' %}{% block content %}<div class="card"><h2>Add Transaction</h2><form method="post"><div class="form-group"><label>Date</label><input type="date" name="date" value="{{today}}" required></div><div class="form-group"><label>Description</label><input name="description" placeholder="Example: Swiggy dinner 450" required></div><div class="form-group"><label>Amount</label><input type="number" step="0.01" min="0.01" name="amount" required></div><div class="form-group"><label>Type</label><select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="form-group"><label>Category (optional)</label><input name="category" placeholder="For expense, ML will predict this"></div><button class="btn">Save Transaction</button></form></div>{% endblock %}
